<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jericho's Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #262624;        /* Claude-style dark warm gray */
      --bg-soft: #30302e;   /* card background */
      --border: #3f3e3b;    /* subtle border */
      --text: #f4f3ee;      /* off-white text */
      --text-dim: #a8a6a0;  /* muted text */
    }

    html, body { height: 100%; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      position: relative;
    }

    /* ════════ CONTENT ════════ */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 20px 70px;
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .title {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(34px, 8.5vw, 50px);
      line-height: 1.1;
      text-align: center;
      margin-bottom: 12px;
      color: var(--text);
    }
    .title .accent {
      color: #d97757; /* warm accent, Claude-ish orange */
    }

    .subtitle {
      font-weight: 700;
      font-size: clamp(13px, 3.6vw, 16px);
      color: var(--text-dim);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 7px 20px;
      margin-bottom: 40px;
      text-align: center;
    }

    /* ── link cards ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      border-radius: 18px;
      padding: 14px 16px;
      background: var(--bg-soft);
      border: 1.5px solid var(--border);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--edge);
      background: #35342f;
    }
    .card:active { transform: translateY(1px); }

    .yt { --edge: #ff5f5f; }
    .li { --edge: #4da3ff; }
    .ig { --edge: #ff6ec7; }

    .card-icon {
      width: 50px; height: 50px;
      border-radius: 14px;
      background: #f4f3ee;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-icon svg { width: 26px; height: 26px; }

    .card-text { flex: 1; min-width: 0; }
    .card-name {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: 20px;
      color: var(--text);
      display: block;
      line-height: 1.05;
    }
    .card-sub {
      font-weight: 700;
      font-size: 12.5px;
      color: var(--text-dim);
      display: block;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform .15s, border-color .15s;
    }
    .card:hover .card-arrow { transform: translateX(3px); border-color: var(--edge); }
    .card-arrow svg { width: 16px; height: 16px; }

    .pill {
      margin-top: 40px;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: 15px;
      color: var(--text);
      background: var(--bg-soft);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 10px 26px;
    }

    /* ════════ MOBILE ════════ */
    @media (max-width: 480px) {
      .page { padding: 48px 16px 56px; }
      .card { padding: 12px 13px; gap: 12px; }
      .card-icon { width: 44px; height: 44px; }
      .card-icon svg { width: 22px; height: 22px; }
      .card-name { font-size: 18px; }
      .card-sub { font-size: 11.5px; }
      .card-arrow { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>

<div class="page">

  <h1 class="title">JERICHO'S <span class="accent">LINKS</span></h1>
  <p class="subtitle">Connect with me on my other platforms</p>

  <div class="links">

    <!-- GitHub -->

      </div>
      <div class="card-text">
        <span class="card-name">GitHub</span>
        <span class="card-sub">Check out my code!</span>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f4f3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>

    <!-- LinkedIn -->
    <a class="card li" href="https://www.linkedin.com/in/jericho-huang-052682383/" target="_blank" rel="noopener">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="#1268b3"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
      </div>
      <div class="card-text">
        <span class="card-name">LinkedIn</span>

      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f4f3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </a>

    <!-- Instagram -->
    <a class="card ig" href="https://www.instagram.com/mr.yellow36/" target="_blank" rel="noopener">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e1306c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </div>
      <div class="card-text">
        <span class="card-name">Instagram</span>
        <span class="card-sub">See my life in pictures!</span>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f4f3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </a>

  </div>

  <div class="pill">Let's connect!</div>

</div>

</body>
</html>
